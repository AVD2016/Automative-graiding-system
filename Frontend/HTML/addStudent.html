<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student</title>

  <link rel="stylesheet" href="../CSS/chatWidget.css">
  <link rel="stylesheet" href="../CSS/generalStyles.css">

<style>
.content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
  position: relative;
  overflow: hidden;
}
</style>

</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Admin Panel</h2>

    <button onclick="openViewLecturers()">View All Lecturers</button>
    <button onclick="openAddNewLecturer()">Add New Lecturer</button>
    <button onclick="openViewAllStudents()">View All Students</button>
    <button onclick="openAddStudent()">Add New Student</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left">
        <img src="icon.png" onclick="openDashboard()" style="cursor:pointer;">
        <h1>Automated Grading System</h1>
      </div>

      <div class="admin-name" id="adminName"></div>

    </div>

    <!-- CONTENT -->
    <div class="content">

      <div class="form-card">

        <h2>Add Student</h2>

        <form id="addStudentForm">

          <label>ID</label>
          <input type="number" id="id" required>

          <label>First Name</label>
          <input type="text" id="firstName" required>

          <label>Last Name</label>
          <input type="text" id="lastName" required>

          <label>Username</label>
          <input type="text" id="username" required>

          <label>Temporary Password</label>
          <input type="text" id="password" required>

          <label>Email</label>
          <input type="email" id="email" required>

          <button type="submit" class="submit">Add Student</button>

        </form>

        <span class="back" onclick="goBack()">← Back to Dashboard</span>

      </div>

    </div>

  </div>

  <!-- CHAT -->
  <div id="chatToggle" class="chat-toggle">
    <img src="../Images/chat.png" alt="Chat" />
  </div>

  <div id="chatWidget" class="chat-widget hidden">

    <div class="chat-header">
      <span>Support Chat</span>
      <button onclick="toggleChat()">✕</button>
    </div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script src="../JS/addStudent.js"></script>
  <script src="../JS/chatWidget.js"></script>
  <script src="../JS/administratorNavigation.js"></script>

</body>
</html>
