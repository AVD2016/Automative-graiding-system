<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Administrator Dashboard</title>

  <link rel="stylesheet" href="../CSS/chatWidget.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* SIDEBAR */

    .sidebar {
      width: 240px;
      background-color: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .sidebar button {
      background: none;
      border: none;
      color: white;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .sidebar button:hover {
      background-color: #334155;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* TOPBAR */

    .topbar {
      height: 70px;
      background-color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 3;
    }

    /* ICON + TITLE BUTTON */
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }

    .topbar-left img {
      width: 45px;
      height: 45px;
    }

    .topbar-left h1 {
      font-size: 22px;
      color: #1e293b;
    }

    .admin-name {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
    }

    /* CONTENT WITH BACKGROUND */

    .content {
      flex: 1;
      padding: 30px;

      position: relative;
      overflow: hidden;
    }

    .content::after {
      content: "";
      position: absolute;
      inset: 0;

      background-image: url("Background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 0;
    }

    .content::before {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(0,0,0,0.35);
      z-index: 1;
      pointer-events: none;
    }

    /* OPTIONAL: if content later becomes visible */
    .content > * {
      position: relative;
      z-index: 2;
    }

  </style>

</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Admin Panel</h2>

    <button onclick="openViewLecturers()">View All Lecturers</button>
    <button onclick="openAddNewLecturer()">Add New Lecturer</button>
    <button onclick="openViewAllStudents()">View All Students</button>
    <button onclick="openAddStudent()">Add New Student</button>
    <button onclick="logout()">Logout</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left" onclick="openDashboard()">
        <img src="icon.png" alt="System Icon">
        <h1>Automated Grading System</h1>
      </div>

      <div class="admin-name" id="adminName"></div>

    </div>

    <!-- CONTENT -->
    <div class="content"></div>

  </div>

  <!-- CHAT -->
  <div id="chatToggle" class="chat-toggle">
    <img src="question.jpg" alt="Chat" />
  </div>

  <div id="chatWidget" class="chat-widget hidden">

    <div class="chat-header">
      <span>Support Chat</span>
      <button onclick="toggleChat()">✕</button>
    </div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script src="../JS/admin-dashboard.js"></script>
  <script src="../JS/chatWidget.js"></script>
  <script src="../JS/administratorNavigation.js"></script>

  <!-- LOGIC -->
  <script>
    function openDashboard() {
      window.location.href = "admin-dashboard.html";
    }

    document.addEventListener("DOMContentLoaded", () => {

      const admin = JSON.parse(localStorage.getItem("user"));

      document.getElementById("adminName").textContent =
        admin ? `${admin.firstName} ${admin.lastName}` : "Administrator";

    });
  </script>

</body>

</html>
