<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Student Dashboard</title>

  <link rel="stylesheet" href="../CSS/chatWidget.css">
  <link rel="stylesheet" href="../CSS/generalStyles.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    /* ========================= LAYOUT ========================= */

    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      position: relative;
    }

    .content::after {
      content: "";
      position: fixed;
      top: 0;
      left: 240px;
      width: calc(100% - 240px);
      height: 100vh;

      background-image: url("../Images/Background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 0;
    }

    .content::before {
      content: "";
      position: fixed;
      top: 0;
      left: 240px;
      width: calc(100% - 240px);
      height: 100vh;

      background: rgba(0,0,0,0.35);
      z-index: 1;
    }

    /* ========================= GRID ========================= */

    .dashboard-grid {
      position: relative;
      z-index: 2;

      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    /* ========================= CARDS ========================= */

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #1e293b;
    }

    /* ========================= CALENDAR ========================= */

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px;
      min-height: 55px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.15s;
    }

    .day:hover {
      transform: scale(1.03);
    }

    .day-number {
      font-weight: bold;
      font-size: 11px;
      color: #1e293b;
    }

    /* status colors */
    .green { background: #bbf7d0; }
    .grey  { background: #e2e8f0; }
    .red   { background: #fecaca; }
    .orange{ background: #fde68a; }

    /* ========================= DETAILS ========================= */

    .details {
      margin-top: 10px;
      font-size: 12px;
      color: #334155;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      border-radius: 5px;
      margin-top: 4px;
      color: white;
    }

    .badge-green { background: #16a34a; }
    .badge-grey  { background: #64748b; }
    .badge-red   { background: #dc2626; }

    /* ========================= WARNINGS ========================= */

    .warning {
      background: #fff7ed;
      border-left: 3px solid #f97316;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #7c2d12;
      border-radius: 4px;
    }

    /* ========================= CHART ========================= */

    canvas {
      width: 100% !important;
      max-height: 230px;
    }

    /* ========================= RIGHT SIDE ========================= */

    .side {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

  </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h2>Student Panel</h2>

  <button onclick="openViewModules()">View Modules</button>
  <button onclick="openGrades()">Grades</button>
  <button onclick="openAssignments()">Assignments</button>
  <button onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <div class="topbar-left" onclick="openDashboard()">
      <img src="icon.png">
      <h1>Automated Grading System</h1>
    </div>

    <div class="student-name" id="studentName">Student</div>

  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="dashboard-grid">

      <!-- LEFT: CALENDAR -->
      <div class="card">

        <h2>Assignments Calendar</h2>

        <div id="calendar" class="calendar"></div>

        <div id="selectedDay" class="details">
          Select a day
        </div>

      </div>

      <!-- RIGHT SIDE -->
      <div class="side">

        <!-- WARNINGS -->
        <div class="card">

          <h2>Warnings</h2>
          <div id="warnings"></div>

        </div>

        <!-- PROGRESS -->
        <div class="card">

          <h2>Year Progress</h2>
          <canvas id="progressChart"></canvas>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- CHAT -->
<div id="chatToggle" class="chat-toggle">
  <img src="../Images/chat.png">
</div>

<div id="chatWidget" class="chat-widget hidden">

  <div class="chat-header">
    <span>Support Chat</span>
    <button onclick="toggleChat()">✕</button>
  </div>

  <div id="chatMessages" class="chat-messages"></div>

  <div class="chat-input">
    <input id="chatInput" type="text">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<!-- ========================= JS ========================= -->
<script src="../JS/chatWidget.js"></script>
<script src="../JS/studentNavigation.js"></script>
<script src="../JS/student-dashboard.js"></script>

</body>

</html>
