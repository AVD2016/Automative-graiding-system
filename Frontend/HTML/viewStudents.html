<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Students</title>

  <link rel="stylesheet" href="../CSS/chatWidget.css">
  <link rel="stylesheet" href="../CSS/generalStyles.css">
  <link rel="stylesheet" href="../CSS/adminModalStyles.css">

</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Admin Panel</h2>

    <button onclick="openViewLecturers()">View All Lecturers</button>
    <button onclick="openAddNewLecturer()">Add New Lecturer</button>
    <button onclick="openViewAllStudents()">View All Students</button>
    <button onclick="openAddStudent()">Add New Student</button>
    <button onclick="logout()">Logout</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-left" onclick="openDashboard()">
        <img src="icon.png" alt="System Icon">
        <h1>Automated Grading System</h1>
      </div>

      <div class="admin-name" id="adminName"></div>

    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- CREATE MODULE BUTTON -->
      <div class="create-module-wrapper">
        <button class="create-module-btn"
                onclick="openCreateModuleModal()">
          Create Module
        </button>
      </div>

      <div class="table-container">

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Registered Modules</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="studentsTableBody">
            <tr>
              <td colspan="7" class="loading">
                Loading students...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- REGISTER MODULE MODAL -->
  <div class="modal" id="moduleModal">

    <div class="modal-content">

      <h2>Register Student For Modules</h2>

      <div id="modulesList"></div>

      <div class="modal-actions">

        <button class="modal-btn"
                onclick="submitModuleRegistration()">
          Save Registration
        </button>

        <button class="modal-btn"
                onclick="closeModal()">
          Cancel
        </button>

      </div>

    </div>

  </div>

  <!-- CREATE MODULE MODAL -->
  <div class="modal" id="createModuleModal">

    <div class="modal-content">

      <h2>Create Module</h2>

      <label>Module Code</label>
      <input type="text" id="moduleCode">

      <label>Module Name</label>
      <input type="text" id="moduleName">

      <label>Credits</label>
      <input type="number" id="moduleCredits">

      <div class="modal-actions">

        <button class="modal-btn"
                onclick="createModule()">
          Create Module
        </button>

        <button class="modal-btn"
                onclick="closeCreateModuleModal()">
          Cancel
        </button>

      </div>

    </div>

  </div>

  <!-- CHAT -->
  <div id="chatToggle" class="chat-toggle">
    <img src="question.jpg" alt="Chat" />
  </div>

  <div id="chatWidget" class="chat-widget hidden">

    <div class="chat-header">
      <span>Support Chat</span>
      <button onclick="toggleChat()">✕</button>
    </div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script src="../JS/viewStudents.js"></script>
  <script src="../JS/chatWidget.js"></script>
  <script src="../JS/administratorNavigation.js"></script>

</body>
</html>
