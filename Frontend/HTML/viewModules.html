<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecturer Modules Overview</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6f9;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: #1e293b;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: none;
      border: none;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #334155;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    thead {
      background: #1e293b;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h3>Lecturer Panel</h3>

    <button onclick="openViewModules()">View Modules</button>
    <button onclick="openCreateAssignment()">Create Assignment</button>
    <button onclick="openMarkAssignment()">Mark Assignment</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main">

    <h2 id="lecturerName">Modules Overview</h2>

    <table>
      <thead>
        <tr>
          <th>Module Code</th>
          <th>Module Name</th>
          <th>Module Credits</th>
          <th>Assigned Credits</th>
          <th>Coursework Count</th>
          <th>Students Enrolled</th>
        </tr>
      </thead>

      <tbody id="modulesTableBody">
        <tr>
          <td colspan="6" class="loading">Loading...</td>
        </tr>
      </tbody>
    </table>

  </div>

  <script src="../JS/viewModules.js"></script>
</body>
</html>
